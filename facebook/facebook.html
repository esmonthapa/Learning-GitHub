<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Signup</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=visibility_off" />
    <link rel="stylesheet" href="facebook.css">
</head>
<body>
    <div class="hero">
        <div class="text-area">
            <h1>facebook</h1>
            <p>Facebook helps you connect and share with people in your life.</p>
        </div>
        <div class="signup-area">
            <div class="input-area">
                <div class="username">
                    <input type="text" placeholder="Full Name">
                </div>
                <div class="password ">
                    <input type="password" placeholder="Password">
                    <span class="material-symbols-outlined hover">visibility_off</span>
                </div>
                <div class="login-btn hover">
                    <button class="hover">Log in</button>
                </div>
                <div class="forgot-pass">
                    <p class="hover">Forgotten password?</p>
                </div>
                <div class="new-acc">
                    <button class="hover">Create new account</button>
                </div>
            </div>
            <div class="info">
                <p><b>Create a page</b> for a celebrity, brand or business.</p>
            </div>
        </div>
    </div>
</body>
</html>
